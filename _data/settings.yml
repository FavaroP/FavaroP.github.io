# Change Homepage information here
homepage:
  title: "Welcome!"
  profile_picture: "/assets/img/profile-picture.png" # This picture must have the width 1.0258302583 bigger than the height
  introduction: |
    I am a FNRS Research Fellow (2022-2026) within the Power Systems and Markets Research Group ([PSMR](https://www.linkedin.com/company/power-systems-and-market-research-group-psmr-umons/?trk=organization-update_share-update_actor-image&originalSubdomain=mh)) at the University of Mons ([UMons](https://web.umons.ac.be/en/)), Belgium. My main advisors are Prof. [François Vallée](https://scholar.google.be/citations?user=roSolfAAAAAJ&hl=en) and Dr. [Jean-François Toubeau](https://scholar.google.com.mx/citations?user=ZfhfurUAAAAJ&hl=en). My research interests include machine learning, optimization, energy markets and power systems. Currently, my focus lies mainly on bringing machine learning and optimization together for short-term planning tacks. I enjoyed research stays within [Yury Dvorkin](https://scholar.google.com/citations?user=lI2PTkAAAAAJ&hl=fr&oi=ao)'s group at Johns Hopkins University as a BAEF fellow, and [Thomas Morstyn](https://scholar.google.com.sg/citations?user=nvzgGIcAAAAJ&hl=en)'s research group at the University of Edinburgh. <br />

    Before starting my PhD in October 2022, I received two Master's Degrees: one in electrical engineering from the University of Mons, Belgium and a second in “Smart Cities and Communities ([SMACCs](https://www.smaccs.eu/))” from Heriot Watt University. <br />

    Next to my research, I teach a few hours about unbalance distribution network to master students at the Faculty of Engineering at UMons. I was also the co-organizer of the UMons AI Week event.

